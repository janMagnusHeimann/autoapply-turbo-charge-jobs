# Railway Multi-Service Configuration
# Documentation: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
watchPatterns = ["src/**", "backend/**", "package.json", "requirements.txt"]

[deploy]
startCommand = "echo 'See individual service configs'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
